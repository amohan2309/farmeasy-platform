server:
  port: 8081

spring:
  application:
    name: authentication-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/FarmEasy}
    username: ${SPRING_DATASOURCE_USERNAME:anandmohan}
    password: ${SPRING_DATASOURCE_PASSWORD:FarmEasy}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_schema: authentication
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

farmeasy:
  jwt:
    secret: ${JWT_SECRET:FarmEasySecretKeyChangeInProductionUse256BitsMinimum!!}
    access-expiration-ms: 3600000
    refresh-expiration-days: 7
  auth:
    dev-phone: ${DEV_LOGIN_PHONE:9876543210}
    dev-otp: ${DEV_LOGIN_OTP:123456}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
