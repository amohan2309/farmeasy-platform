server:
  port: 8080

spring:
  application:
    name: farmeasy-gateway
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: authentication
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/auth/**,/api/users/**,/api/roles/**,/api/otp/**,/api/password-reset/**,/api/devices/**,/api/audit/**
        - id: subscription
          uri: ${SUBSCRIPTION_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/subscriptions/**,/api/entitlements/**,/api/usage/**
        - id: catalog
          uri: ${CATALOG_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/apps/**,/api/content/**
        - id: i18n
          uri: ${I18N_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/i18n/**
        - id: chatbot
          uri: ${CHATBOT_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/chatbot/**
        - id: marketplace
          uri: ${MARKETPLACE_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/api/marketplace/**
        - id: weather
          uri: ${WEATHER_SERVICE_URL:http://localhost:8087}
          predicates:
            - Path=/api/weather/**
        - id: irrigation
          uri: ${IRRIGATION_SERVICE_URL:http://localhost:8088}
          predicates:
            - Path=/api/irrigation/**
        - id: iot
          uri: ${IOT_SERVICE_URL:http://localhost:8089}
          predicates:
            - Path=/api/iot/**
        - id: crop-selling
          uri: ${CROP_SELLING_SERVICE_URL:http://localhost:8090}
          predicates:
            - Path=/api/crop-selling/**
        - id: live-prices
          uri: ${LIVE_PRICES_SERVICE_URL:http://localhost:8091}
          predicates:
            - Path=/api/prices/**
        - id: dashboard
          uri: ${DASHBOARD_SERVICE_URL:http://localhost:8092}
          predicates:
            - Path=/api/dashboard/**

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: INFO
    com.farmeasy: DEBUG
