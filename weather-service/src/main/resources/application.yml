server:
  port: 8087

spring:
  application:
    name: weather-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/FarmEasy}
    username: ${SPRING_DATASOURCE_USERNAME:anandmohan}
    password: ${SPRING_DATASOURCE_PASSWORD:FarmEasy}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_schema: weather

farmeasy:
  weather:
    open-meteo-url: ${OPEN_METEO_URL:https://api.open-meteo.com/v1/forecast}
    latitude: ${WEATHER_LATITUDE:25.5941}
    longitude: ${WEATHER_LONGITUDE:85.1356}
    timezone: ${WEATHER_TIMEZONE:auto}
    location-name: ${WEATHER_LOCATION_NAME:Patna, India}

management:
  endpoints:
    web:
      exposure:
        include: health,info
